---
name: Build image

on:
  workflow_call:
    inputs:
      app:
        description: "App directory name under apps/"
        required: true
        type: string
      version:
        description: "Image tag (e.g. 18.1-1)"
        required: true
        type: string
      platforms:
        description: "Comma-separated list of target platforms"
        required: false
        type: string
        default: "linux/amd64"
      push:
        description: "Push image to registry"
        required: false
        type: boolean
        default: true
      create_release:
        description: "Create a per-app git tag and GitHub Release on success"
        required: false
        type: boolean
        default: false
    outputs:
      digest:
        description: "Pushed image digest"
        value: ${{ jobs.build.outputs.digest }}
      image:
        description: "Fully-qualified image reference (image@digest)"
        value: ${{ jobs.build.outputs.image }}

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/${{ inputs.app }}

jobs:
  build:
    name: build ${{ inputs.app }}:${{ inputs.version }}
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image: ${{ steps.ref.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        if: contains(inputs.platforms, 'arm64')
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: inputs.push
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: apps/${{ inputs.app }}
          file: apps/${{ inputs.app }}/Dockerfile
          platforms: ${{ inputs.platforms }}
          push: ${{ inputs.push }}
          provenance: mode=max
          sbom: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ inputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=${{ inputs.app }}
            org.opencontainers.image.version=${{ inputs.version }}

      - name: Compose pinned image reference
        id: ref
        if: inputs.push
        run: |
          echo "image=${REGISTRY}/${IMAGE_NAME}@${DIGEST}" >>"$GITHUB_OUTPUT"
        env:
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          DIGEST: ${{ steps.build.outputs.digest }}

      - name: Install cosign
        if: inputs.push
        uses: sigstore/cosign-installer@v3

      - name: Sign image (keyless)
        if: inputs.push
        env:
          COSIGN_EXPERIMENTAL: "true"
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE_REF"

      - name: Attest build provenance
        if: inputs.push
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Create git tag and GitHub Release
        if: inputs.push && inputs.create_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP: ${{ inputs.app }}
          VERSION: ${{ inputs.version }}
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          DIGEST: ${{ steps.build.outputs.digest }}
          PLATFORMS: ${{ inputs.platforms }}
        run: |
          set -euo pipefail
          TAG="${APP}-${VERSION}"
          PINNED="${REGISTRY}/${IMAGE_NAME}:${VERSION}@${DIGEST}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" -m "${APP} ${VERSION}" "${GITHUB_SHA}"
          git push origin "${TAG}"

          NOTES=$(cat <<EOF
          **Image:** \`${REGISTRY}/${IMAGE_NAME}:${VERSION}\`
          **Digest:** \`${DIGEST}\`
          **Pinned reference:** \`${PINNED}\`
          **Platforms:** \`${PLATFORMS}\`

          Built from \`${GITHUB_SHA}\`. Signed with cosign keyless OIDC and attested via SLSA build provenance.
          EOF
          )
          gh release create "${TAG}" \
            --title "${APP} ${VERSION}" \
            --notes "${NOTES}" \
            --target "${GITHUB_SHA}"

      - name: Job summary
        if: inputs.push
        run: |
          {
            echo "### ${IMAGE_NAME}:${VERSION}"
            echo
            echo "- Image: \`${REGISTRY}/${IMAGE_NAME}:${VERSION}\`"
            echo "- Digest: \`${DIGEST}\`"
            echo "- Pinned: \`${REGISTRY}/${IMAGE_NAME}:${VERSION}@${DIGEST}\`"
            echo "- Platforms: \`${PLATFORMS}\`"
          } >>"$GITHUB_STEP_SUMMARY"
        env:
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          VERSION: ${{ inputs.version }}
          DIGEST: ${{ steps.build.outputs.digest }}
          PLATFORMS: ${{ inputs.platforms }}
